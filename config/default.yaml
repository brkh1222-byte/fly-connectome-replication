# Shiu et al. (2024) model parameters (model.py defaults) and run settings
model:
  v_0: -52.0      # mV
  v_rst: -52.0    # mV
  v_th: -45.0     # mV
  t_mbr: 20.0     # ms
  tau: 5.0        # ms
  t_rfc: 2.2      # ms
  t_dly: 1.8      # ms
  w_syn: 0.275    # mV per synapse
  f_poi: 250
  dt: 0.1         # ms
run:
  t_run: 1000.0   # ms (Shiu)
  n_trials: 30    # Shiu
  device: cpu     # cpu | mps | cuda
